<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repository Name</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: #f6f8fa;
            color: #24292e;
        }

        .container {
            max-width: 1012px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
        }

        .header {
            padding: 24px;
            border-bottom: 1px solid #e1e4e8;
        }

        .repo-name {
            font-size: 32px;
            font-weight: 600;
            margin: 0 0 8px 0;
        }

        .repo-description {
            color: #6a737d;
            margin: 0;
            font-size: 14px;
        }

        .nav-tabs {
            display: flex;
            gap: 24px;
            border-bottom: 1px solid #e1e4e8;
            padding: 0 24px;
        }

        .nav-tab {
            color: #24292e;
            text-decoration: none;
            border-bottom: 3px solid transparent;
            padding: 16px 0;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
        }

        .nav-tab.active {
            border-bottom-color: #f85149;
            color: #24292e;
        }

        .readme-section {
            padding: 24px;
        }

        .readme-header {
            margin-bottom: 16px;
        }

        .readme-title {
            font-size: 20px;
            font-weight: 600;
            margin: 0;
        }

        article.markdown-body {
            word-wrap: break-word;
        }

        .markdown-body h1,
        .markdown-body h2 {
            border-bottom: 1px solid #eaecef;
            padding-bottom: 0.3em;
            margin-bottom: 16px;
            margin-top: 24px;
        }

        .markdown-body h1 {
            font-size: 32px;
            font-weight: 600;
            margin-top: 0;
        }

        .markdown-body h2 {
            font-size: 24px;
            font-weight: 600;
        }

        .markdown-body h3 {
            font-size: 20px;
            font-weight: 600;
            margin-top: 24px;
            margin-bottom: 16px;
        }

        .markdown-body h4,
        .markdown-body h5,
        .markdown-body h6 {
            font-weight: 600;
            margin-top: 24px;
            margin-bottom: 16px;
        }

        .markdown-body h4 {
            font-size: 16px;
        }

        .markdown-body h5 {
            font-size: 14px;
        }

        .markdown-body h6 {
            font-size: 12px;
            color: #6a737d;
        }

        .markdown-body p {
            margin-bottom: 16px;
            line-height: 1.6;
        }

        .markdown-body ul,
        .markdown-body ol {
            padding-left: 2em;
            margin-bottom: 16px;
        }

        .markdown-body li {
            margin-bottom: 4px;
        }

        .markdown-body blockquote {
            padding: 0 1em;
            color: #6a737d;
            border-left: 0.25em solid #dfe2e5;
            margin: 0 0 16px 0;
        }

        .markdown-body code {
            padding: 0.2em 0.4em;
            margin: 0;
            background: rgba(27, 31, 35, 0.05);
            border-radius: 3px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 85%;
        }

        .markdown-body pre {
            padding: 16px;
            overflow: auto;
            background: #f6f8fa;
            border-radius: 6px;
            margin-bottom: 16px;
            line-height: 1.45;
        }

        .markdown-body pre code {
            display: inline;
            padding: 0;
            margin: 0;
            overflow: visible;
            line-height: inherit;
            background: transparent;
        }

        .markdown-body a {
            color: #0366d6;
            text-decoration: none;
        }

        .markdown-body a:hover {
            text-decoration: underline;
        }

        .markdown-body img {
            max-width: 100%;
            height: auto;
        }

        .markdown-body table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 16px;
        }

        .markdown-body table tr {
            background: white;
            border-top: 1px solid #dfe2e5;
        }

        .markdown-body table tr:nth-child(2n) {
            background: #f6f8fa;
        }

        .markdown-body table th,
        .markdown-body table td {
            padding: 6px 13px;
            border: 1px solid #dfe2e5;
        }

        .markdown-body table th {
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="repo-name">repository-name</h1>
            <p class="repo-description">Add your repository description here</p>
        </div>

        <div class="nav-tabs">
            <div class="nav-tab active">Code</div>
            <div class="nav-tab">Issues</div>
            <div class="nav-tab">Pull requests</div>
            <div class="nav-tab">Wiki</div>
        </div>

        <div class="readme-section">
            <div class="readme-header">
                <h2 class="readme-title">README.md</h2>
            </div>
            <article class="markdown-body">
                <p><em>Your README content will appear here</em></p>
            </article>
        </div>
    </div>
</body>
</html>
